[package]
name = "fujimod-emulator-javascript"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
doctest = false
name = "fujimod_emulator_javascript"
crate-type = ["staticlib", "rlib"]

[dependencies]
ciborium.workspace = true
fujimod-emulator = { workspace = true, default-features = false }
fujimod-emulator-cpu.workspace = true
fujimod-emulator-cpu-unicorn.workspace = true
fujimod-emulator-devices.workspace = true
fujimod-emulator-exr2-board.workspace = true
fujimod-emulator-exr2-plan.workspace = true
fujimod-firmware.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2 = { workspace = true, default-features = false }
fujimod-workspace-hack.workspace = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
