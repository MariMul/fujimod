[package]
name = "fujimod-python"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[lib]
name = "fujimod_python"
test = false
doctest = false

[features]
default = ["emulator"]
emulator = [
    "dep:cc",
    "dep:fujimod-emulator",
    "dep:fujimod-emulator-cpu",
    "dep:fujimod-emulator-devices", "dep:fujimod-emulator-imaging", "dep:fujimod-emulator-storage",
    "dep:fujimod-emulator-exr2-plan",
    "dep:pkg-config",
    "dep:sha2",
    "fujimod-remote/board",
]
testing = ["fujimod-usb/testing", "fujimod-remote/testing"]

[dependencies]
fujimod-emulator-imaging = { path = "../../crates/emulator-imaging", optional = true }
fujimod-emulator-storage = { path = "../../crates/emulator-storage", optional = true }
fujimod-remote = { workspace = true, default-features = false, features = ["ff80"] }
fujimod-recording.workspace = true
fujimod-firmware = { path = "../../crates/firmware" }
pyo3 = { workspace = true, features = ["experimental-async", "multiple-pymethods"] }
fujimod-usb.workspace = true
fujimod-workflows.workspace = true
fujimod-catalog.workspace = true
fujimod-settings.workspace = true
fujimod-corpus = { path = "../../crates/corpus" }
fujimod-emulator = { path = "../../crates/emulator", optional = true }
fujimod-emulator-cpu = { path = "../../crates/emulator-cpu", optional = true }
fujimod-emulator-devices = { path = "../../crates/emulator-devices", optional = true }
fujimod-emulator-exr2-plan = { path = "../../crates/emulator-exr2-plan", optional = true }
serde.workspace = true
serde_json.workspace = true
futures-lite.workspace = true
futures-channel.workspace = true
nusb.workspace = true
sha2 = { workspace = true, optional = true }
fujimod-workspace-hack.workspace = true

[build-dependencies]
fujimod-bindgen = { path = "../generator" }
cc = { version = "1", optional = true }
pkg-config = { version = "0.3", optional = true }
