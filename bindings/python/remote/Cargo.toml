[package]
name = "fujimod-python-remote"
description = "Python bindings for remote cameras over USB and emulator boards"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
test = false
doctest = false

[features]
emulator = ["dep:fujimod-python-emulator", "dep:fujimod-emulator", "fujimod-remote/board"]
testing = ["fujimod-remote/testing"]

[dependencies]
fujimod-python-usb = { path = "../usb" }
fujimod-python-emulator = { path = "../emulator", optional = true }
fujimod-emulator = { workspace = true, optional = true }
fujimod-remote = { workspace = true, default-features = false, features = ["ff80"] }
fujimod-usb.workspace = true
pyo3.workspace = true
serde.workspace = true
serde_json.workspace = true
futures-lite.workspace = true
fujimod-workspace-hack.workspace = true
