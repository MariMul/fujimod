[package]
name = "fujimod-python-usb"
description = "Python bindings for USB sessions, app80 commands, tracing, workflows and firmware files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
test = false
doctest = false

[features]
testing = ["fujimod-usb/testing"]

[dependencies]
fujimod-python-service = { path = "../service" }
fujimod-python-usb-lease = { path = "../usb-lease" }
fujimod-catalog-service.workspace = true
fujimod-firmware.workspace = true
fujimod-usb.workspace = true
fujimod-workflows.workspace = true
pyo3.workspace = true
futures-lite.workspace = true
futures-channel.workspace = true
nusb.workspace = true
fujimod-workspace-hack.workspace = true

[build-dependencies]
fujimod-bindgen = { path = "../../generator" }
