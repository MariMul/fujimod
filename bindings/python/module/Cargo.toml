[package]
name = "fujimod-python-module"
description = "The fujimod._native extension module, linking the Python bindings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "_native"
crate-type = ["cdylib"]
test = false
doctest = false

[features]
default = ["emulator"]
emulator = ["fujimod-python/emulator"]
testing = ["fujimod-python/testing"]

[dependencies]
fujimod-python = { path = "..", default-features = false }
pyo3.workspace = true
fujimod-workspace-hack.workspace = true
