[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "fujimod"
version = "0.1.0"
requires-python = ">=3.10"
description = "FujiMod camera tools"
readme = "README.md"
license-files = ["NOTICE"]

[tool.maturin]
module-name = "fujimod._native"
python-source = "python"

[tool.uv]
# Rebuild local installs when either the binding or its Rust implementation changes.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "NOTICE" },
    { file = "Cargo.toml" },
    { file = "src/**/*.rs" },
    { file = "python/**/*.py" },
    { file = "../../Cargo.toml" },
    { file = "../../Cargo.lock" },
    { file = "../../crates/usb/Cargo.toml" },
    { file = "../../crates/usb/src/**/*.rs" },
]
