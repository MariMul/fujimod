<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="Try your camera firmware in the browser and build Fujimod SD boot files."
    />
    <title>Fujimod</title>
    <link rel="icon" href="data:," />
  </head>
  <body>
    <div class="shell">
      <header>
        <a href="./" aria-label="Fujimod"
          ><img src="./brand.png" alt="Fujimod" width="110" height="28"
        /></a>
        <div class="meta build-info">
          <a id="release-label" href="https://github.com/justjake/fujimod"
            >Development</a
          ><a href="https://github.com/justjake/fujimod"
            >github.com/justjake/fujimod</a
          >
        </div>
      </header>
      <main>
        <section class="stage idle" id="workspace">
          <div class="viewer" id="viewer" aria-label="Camera viewer">
            <div class="ghost" aria-hidden="true"></div>
            <div class="bar" id="viewer-bar" hidden>
              <div class="seg" role="group" aria-label="Viewer mode">
                <button class="on" id="view-3d" aria-pressed="true">3D</button
                ><button id="view-lcd" aria-pressed="false">LCD</button>
              </div>
              <span class="grow" id="camera-title"></span>
              <div id="view-actions">
                <button class="pill" id="face-screen">Screen</button
                ><button class="pill" id="face-lens">Lens</button>
              </div>
            </div>
            <label class="dropbox" id="firmware-prompt" for="firmware-file"
              ><strong>Drop FPUPDATE.DAT firmware file from Fujifilm</strong
              ><span>or click to choose it</span></label
            >
            <input
              class="visually-hidden"
              id="firmware-file"
              type="file"
              accept=".dat,.DAT"
              aria-label="Choose firmware DAT"
            />
            <div class="cams" id="idle-cameras">
              <h5>CAMERAS</h5>
              <div class="c" id="camera-cards"></div>
            </div>
            <progress
              id="boot-progress"
              max="100"
              value="0"
              hidden
              aria-label="Boot progress"
            ></progress>
            <section class="err" id="engine-status" role="alert" hidden>
              <h4 id="fault-heading">The emulator stopped</h4>
              <p id="fault-message"></p>
              <code id="fault-raw"></code>
              <div class="act">
                <button class="pill primary" id="undo">Undo 10 s</button
                ><button class="pill" id="restart">Restart</button
                ><button class="pill" id="error-report">
                  Download error report
                </button>
              </div>
            </section>
            <span id="status" role="status" aria-live="polite"></span
            ><span id="live-label"></span>
          </div>
          <aside class="panel" id="panel" aria-label="Camera controls" hidden>
            <div id="controls"></div>
            <hr />
            <div class="sd" id="card-section" aria-label="SD card">
              <div class="head" id="card-header">
                <b>SD CARD</b><span id="card-capacity">FAT32</span>
                <div class="seg" role="group" aria-label="SD card inserted">
                  <button data-card-present="false">OFF</button
                  ><button class="on" data-card-present="true">ON</button>
                </div>
              </div>
              <div class="tree" id="card-files"></div>
              <div class="row" style="margin-top: 10px">
                <button class="pill" id="card-download">Download all</button
                ><button class="pill" id="card-format">Format</button>
              </div>
              <span
                class="visually-hidden"
                id="card-status"
                role="status"
              ></span>
            </div>
          </aside>
        </section>
        <section class="gens" id="camera-table" aria-label="Cameras"></section>
      </main>
      <footer id="model-credit"></footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
