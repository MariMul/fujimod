[package]
name = "fujimod-emulator-xp5"
description = "XP5 register models with explicit SoC inputs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
doctest = false

[dependencies]
fujimod-emulator-parts-io.workspace = true
fujimod-emulator-ip.workspace = true
fujimod-emulator-ip-dmp.workspace = true
fujimod-emulator-ip-arm.workspace = true
fujimod-emulator-graphics.workspace = true
fujimod-emulator-devices.workspace = true
sha2 = "0.10"
serde_json = "1"
serde = { version = "1", features = ["derive", "rc"] }
toml = "0.9"
fujimod-workspace-hack.workspace = true

[target.'cfg(target_arch = "aarch64")'.dependencies]
sha2 = { version = "0.10", features = ["asm-aarch64"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[dev-dependencies]
fujimod-emulator-parts-controls.workspace = true
