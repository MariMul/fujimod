[package]
name = "fujimod-catalog-construction"
description = "Exported device construction topology and hardware model parameters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
doctest = false

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
schemars.workspace = true
tsify = { workspace = true, optional = true }
serde-wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
fujimod-workspace-hack.workspace = true

[features]
# JSON Schema derives, used only to generate and check the committed schemas.
schema = []
# TypeScript declarations for the catalog documents in wasm-bindgen builds.
typescript = ["dep:tsify", "dep:serde-wasm-bindgen", "dep:wasm-bindgen"]
