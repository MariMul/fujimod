[package]
name = "fujimod-emulator-cpu-unicorn"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[features]
serde = ["dep:serde", "fujimod-emulator-cpu/serde"]

[dependencies]
fujimod-emulator-cpu = { path = "../emulator-cpu" }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(not(target_os = "emscripten"))'.dependencies]
libloading = "0.9"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
