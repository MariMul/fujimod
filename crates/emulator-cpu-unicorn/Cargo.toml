[package]
name = "fujimod-emulator-cpu-unicorn"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
doctest = false

[dependencies]
fujimod-emulator-cpu = { path = "../emulator-cpu" }
fujimod-unicorn-sys = { path = "sys" }
serde = { version = "1", features = ["derive"] }
ciborium = "0.2.2"
serde_json = "1"
sha2 = "0.10"
tsify = { workspace = true, optional = true }
serde-wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
fujimod-workspace-hack.workspace = true

[features]
# TypeScript declarations for the browser tier's options and statistics.
typescript = ["dep:tsify", "dep:serde-wasm-bindgen", "dep:wasm-bindgen"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
