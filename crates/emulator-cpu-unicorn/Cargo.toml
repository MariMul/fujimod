[package]
name = "fujimod-emulator-cpu-unicorn"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[package.metadata.fujimod]
# This crate's browser build links the separately built Emscripten archive.
# Its native Unicorn build cannot be checked for wasm32-unknown-unknown.
skip-wasm32-unknown-unknown-check = true

[lib]
doctest = false

[dependencies]
fujimod-emulator-cpu = { path = "../emulator-cpu" }
fujimod-unicorn-sys = { path = "sys" }
serde = { version = "1", features = ["derive"] }
ciborium = "0.2.2"
serde_json = "1"
sha2 = "0.10"
tsify.workspace = true
serde-wasm-bindgen.workspace = true
wasm-bindgen.workspace = true
fujimod-workspace-hack.workspace = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
