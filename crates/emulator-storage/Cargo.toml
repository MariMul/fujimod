[package]
name = "fujimod-emulator-storage"
description = "Host-side FAT, media and persistent input services"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
doctest = false

[dependencies]
fujimod-emulator-parts-storage.workspace = true
fujimod-catalog.workspace = true
fujimod-settings.workspace = true
serde_json = "1"
serde = { version = "1", features = ["derive", "rc"] }
fujimod-workspace-hack.workspace = true

[dev-dependencies]
sha2 = "0.10"

[target.'cfg(target_arch = "aarch64")'.dependencies]
sha2 = { version = "0.10", features = ["asm-aarch64"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
