[package]
name = "fujimod-emulator-storage"
description = "Host-side FAT, media and persistent input services"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
doctest = false

[dependencies]
fujimod-emulator-devices.workspace = true
fujimod-catalog.workspace = true
fujimod-settings.workspace = true
serde_json = "1"
serde = { version = "1", features = ["derive", "rc"] }
tsify = { workspace = true, optional = true }
serde-wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
fujimod-workspace-hack.workspace = true
ruzstd = "0.9.1"

[features]
# TypeScript declarations for card file trees in wasm-bindgen builds.
typescript = ["dep:tsify", "dep:serde-wasm-bindgen", "dep:wasm-bindgen"]

[dev-dependencies]
sha2 = "0.10"

[target.'cfg(target_arch = "aarch64")'.dependencies]
sha2 = { version = "0.10", features = ["asm-aarch64"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
