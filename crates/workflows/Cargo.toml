[package]
name = "fujimod-workflows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
description = "Camera workflows composed from fujimod-usb operations: service mode, mod install"

[lib]
doctest = false

[features]
service-capture = ["dep:serde", "dep:serde_json"]

[dependencies]
fujimod-catalog.workspace = true
fujimod-usb.workspace = true
thiserror.workspace = true
serde = { workspace = true, features = ["derive"], optional = true }
serde_json = { workspace = true, optional = true }
fujimod-workspace-hack.workspace = true

[[example]]
name = "service_capture_plan"
required-features = ["service-capture"]

[dev-dependencies]
fujimod-usb = { workspace = true, features = ["testing"] }
futures-lite.workspace = true
