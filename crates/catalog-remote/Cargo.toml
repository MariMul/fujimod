[package]
name = "fujimod-catalog-remote"
description = "Firmware layouts and build declarations consumed by camera remote control"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
doctest = false

[dependencies]
fujimod-catalog-content.workspace = true
fujimod-catalog-controls.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
schemars.workspace = true
sha2.workspace = true
tsify = { workspace = true, optional = true }
serde-wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
fujimod-workspace-hack.workspace = true

[features]
# JSON Schema derives, used only to generate and check the committed schemas.
schema = ["fujimod-catalog-controls/schema"]
# TypeScript declarations for the catalog documents in wasm-bindgen builds.
typescript = ["dep:tsify", "dep:serde-wasm-bindgen", "dep:wasm-bindgen", "fujimod-catalog-controls/typescript"]
