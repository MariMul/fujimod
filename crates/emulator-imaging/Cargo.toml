[package]
name = "fujimod-emulator-imaging"
description = "Image processing: RAW development, packed color, resampling and filters"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
doctest = false

[dependencies]
fujimod-emulator-devices.workspace = true
serde = { version = "1", features = ["derive", "rc"] }
fujimod-workspace-hack.workspace = true

[dev-dependencies]
sha2 = "0.10"

[target.'cfg(target_arch = "aarch64")'.dependencies]
sha2 = { version = "0.10", features = ["asm-aarch64"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
