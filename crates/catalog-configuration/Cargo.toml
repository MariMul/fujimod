[package]
name = "fujimod-catalog-configuration"
description = "Emulator run configurations, overlays and their hardware, firmware and native inputs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
doctest = false

[dependencies]
fujimod-catalog.workspace = true
fujimod-catalog-construction.workspace = true
fujimod-catalog-content.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
schemars.workspace = true
sha2.workspace = true
tsify = { workspace = true, optional = true }
serde-wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
fujimod-workspace-hack.workspace = true

[features]
# JSON Schema derives, used only to generate and check the committed schemas.
schema = ["fujimod-catalog/schema", "fujimod-catalog-construction/schema"]
# TypeScript declarations for the run configuration documents in wasm-bindgen builds.
typescript = [
  "dep:tsify",
  "dep:serde-wasm-bindgen",
  "dep:wasm-bindgen",
  "fujimod-catalog/typescript",
  "fujimod-catalog-construction/typescript",
]
