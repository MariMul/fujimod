[package]
name = "fujimod-emulator"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
doctest = false
name = "fujimod_emulator"
crate-type = ["rlib"]

[dependencies]
fujimod-emulator-xp5 = { path = "../../crates/emulator-xp5" }
fujimod-emulator-xp4 = { path = "../../crates/emulator-xp4" }
fujimod-recording = { path = "../recording" }
serde = { version = "1", features = ["derive"] }
fujimod-emulator-devices = { path = "../emulator-devices" }
fujimod-emulator-exr2-plan = { path = "../emulator-exr2-plan" }
fujimod-emulator-cpu = { path = "../emulator-cpu" }
fujimod-emulator-cpu-unicorn = { path = "../emulator-cpu-unicorn" }
fujimod-catalog = { path = "../catalog" }
serde_json = "1"
toml = "0.9"
sha2 = "0.10"
fujimod-workspace-hack.workspace = true

[dev-dependencies]
fujimod-emulator-exr2-board = { path = "../emulator-exr2-board" }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[target.'cfg(target_arch = "aarch64")'.dependencies]
sha2 = { version = "0.10", features = ["asm-aarch64"] }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
fujimod-emulator-cpu-hvf = { path = "../emulator-cpu-hvf" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
