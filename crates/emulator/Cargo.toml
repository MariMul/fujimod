[package]
name = "fujimod-emulator"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
doctest = false
name = "fujimod_emulator"
crate-type = ["rlib"]

[dependencies]
fujimod-emulator-imaging = { path = "../../crates/emulator-imaging" }
fujimod-emulator-storage = { path = "../../crates/emulator-storage" }
fujimod-recording = { path = "../recording" }
serde = { version = "1", features = ["derive"] }
fujimod-emulator-devices = { path = "../emulator-devices" }
fujimod-emulator-exr2-plan = { path = "../emulator-exr2-plan" }
fujimod-emulator-cpu = { path = "../emulator-cpu" }
fujimod-emulator-cpu-unicorn = { path = "../emulator-cpu-unicorn" }
fujimod-catalog-content.workspace = true
serde_json = "1"
toml = "0.9"
sha2 = "0.10"
tsify.workspace = true
serde-wasm-bindgen.workspace = true
wasm-bindgen.workspace = true
fujimod-workspace-hack.workspace = true

[dev-dependencies]
fujimod-emulator-exr2-io = { path = "../../crates/emulator-exr2-io" }
fujimod-emulator-exr2-storage = { path = "../../crates/emulator-exr2-storage" }
fujimod-emulator-exr2-system = { path = "../../crates/emulator-exr2-system" }
fujimod-emulator-exr2-board = { path = "../emulator-exr2-board" }
fujimod-emulator-models = { path = "../emulator-models" }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[target.'cfg(target_arch = "aarch64")'.dependencies]
sha2 = { version = "0.10", features = ["asm-aarch64"] }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
fujimod-emulator-cpu-hvf = { path = "../emulator-cpu-hvf" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
