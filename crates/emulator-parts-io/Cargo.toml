[package]
name = "fujimod-emulator-parts-io"
description = "Serial, SPI, USB endpoint, HDMI and audio sink parts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
doctest = false

[dependencies]
fujimod-emulator-devices.workspace = true
serde_json = "1"
serde = { version = "1", features = ["derive", "rc"] }
tsify = { workspace = true, optional = true }
serde-wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
fujimod-workspace-hack.workspace = true

[features]
# TypeScript declarations for USB endpoint reports in wasm-bindgen builds.
typescript = ["dep:tsify", "dep:serde-wasm-bindgen", "dep:wasm-bindgen", "fujimod-emulator-devices/typescript"]

[dev-dependencies]
ciborium = "0.2.2"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
