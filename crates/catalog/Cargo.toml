[package]
name = "fujimod-catalog"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
description = "The reference catalog of SoCs, parts, bodies and firmware and their hardware profiles"

[lib]
doctest = false

[dependencies]
fujimod-catalog-bulk.workspace = true
fujimod-catalog-construction.workspace = true
fujimod-catalog-content.workspace = true
fujimod-catalog-controls.workspace = true
fujimod-catalog-remote.workspace = true
fujimod-catalog-settings.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
schemars.workspace = true
sha2.workspace = true
tsify = { workspace = true, optional = true }
serde-wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
fujimod-workspace-hack.workspace = true

[features]
# JSON Schema derives, used only to generate and check the committed schemas.
schema = ["fujimod-catalog-bulk/schema", "fujimod-catalog-construction/schema", "fujimod-catalog-controls/schema", "fujimod-catalog-remote/schema", "fujimod-catalog-settings/schema"]
# TypeScript declarations for the catalog documents in wasm-bindgen builds.
typescript = [
  "dep:tsify",
  "dep:serde-wasm-bindgen",
  "dep:wasm-bindgen",
  "fujimod-catalog-bulk/typescript",
  "fujimod-catalog-construction/typescript",
  "fujimod-catalog-controls/typescript",
  "fujimod-catalog-remote/typescript",
  "fujimod-catalog-settings/typescript",
]
