[package]
name = "fujimod-catalog"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true
description = "Validated firmware and emulator catalogs shared by FujiMod components"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
schemars.workspace = true
sha2.workspace = true
thiserror.workspace = true
tsify = { workspace = true, optional = true }
serde-wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }

[features]
# TypeScript declarations for the catalog documents in wasm-bindgen builds.
typescript = ["dep:tsify", "dep:serde-wasm-bindgen", "dep:wasm-bindgen"]

[dev-dependencies]
jsonschema = { version = "0.59.0", default-features = false }
