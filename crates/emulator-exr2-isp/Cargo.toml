[package]
name = "fujimod-emulator-exr2-isp"
description = "EXR II image signal processor device models"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
doctest = false

[features]
videotoolbox-tests = []

[dependencies]
fujimod-emulator-devices.workspace = true
fujimod-catalog.workspace = true
serde = { workspace = true, features = ["derive", "rc"] }
serde_json.workspace = true
fujimod-workspace-hack.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
openh264 = "=0.9.3"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[dev-dependencies]
fujimod-emulator-exr2-isp-input.workspace = true
fujimod-emulator-exr2-codecs.workspace = true
