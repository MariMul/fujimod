[package]
name = "fujimod-emulator-exr2-gpu"
description = "EXR II vector GPU"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
doctest = false

[dependencies]
fujimod-emulator-ip-dmp.workspace = true
fujimod-emulator-exr2-plan.workspace = true
fujimod-emulator-graphics.workspace = true
fujimod-emulator-gpu.workspace = true
fujimod-emulator-devices.workspace = true
serde_json = "1"
serde = { version = "1", features = ["derive", "rc"] }
sha2 = "0.10"
fujimod-workspace-hack.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "parking_lot", "metal", "vulkan", "dx12", "wgsl"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
