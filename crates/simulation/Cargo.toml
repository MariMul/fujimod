[package]
name = "fujimod-simulation"
version.workspace = true
edition.workspace = true
rust-version = "1.97.1"
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bevy = { workspace = true, features = ["std", "default_app", "3d_bevy_render", "scene", "webgpu", "jpeg", "mesh_picking", "serialize"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { workspace = true, features = ["bevy_winit"] }
wasm-bindgen.workspace = true
js-sys.workspace = true
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "console"] }
