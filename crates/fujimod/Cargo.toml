[package]
name = "fujimod"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
simulation = ["dep:fujimod-simulation"]
defs = ["dep:fujimod-defs"]
usb = ["defs", "dep:fujimod-usb"]
mod-install = ["usb", "dep:fujimod-mod-install"]

[dependencies]
fujimod-simulation = { workspace = true, optional = true }
fujimod-defs = { workspace = true, optional = true }
fujimod-usb = { workspace = true, optional = true }
fujimod-mod-install = { workspace = true, optional = true }
