[tools]
node = "26.12.0"
rust = { version = "1.99.1", profile = "minimal", components = ["rustfmt", "clippy"] }

[tasks.web-build]
dir = "{{config_root}}/apps/web"
run = "npm run build"

[tasks.web-test]
dir = "{{config_root}}/apps/web"
run = "npm test"

[tasks.web-preview]
dir = "{{config_root}}/apps/web"
run = "npm run preview -- --mode local-preview --port 5190 --strictPort"

[tasks.rust-test]
run = "cargo test --workspace --all-features"

[tasks.rust-check]
run = "cargo clippy --workspace --all-targets --all-features -- -D warnings"

[tasks.rust-wasm-test]
run = 'PATH="$PWD/target/tooling/bin:$PATH" cargo test -p fujimod-usb --target wasm32-unknown-unknown --features testing --lib --test wasm_core'

[tasks.javascript-build]
dir = "{{config_root}}/bindings/javascript"
run = "npm run build"

[tasks.javascript-test]
dir = "{{config_root}}/bindings/javascript"
run = "npm test"

[tasks.javascript-browser-test]
dir = "{{config_root}}/bindings/javascript"
run = "npm run test:browser"
