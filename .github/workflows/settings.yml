name: Settings generated sources

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  committed-sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and test committed C without generator dependencies
        run: python3 -m unittest discover -s mods/lib/settings/tests -v

  regeneration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert generated files match committed files byte for byte
        run: python3 mods/lib/settings/generate.py --check
