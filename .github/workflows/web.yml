name: Web checks
on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'bindings/python/python/fujimod/presentation/controls.json'
      - '.github/workflows/web.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - 'bindings/python/python/fujimod/presentation/controls.json'
      - '.github/workflows/web.yml'
permissions:
  contents: read
concurrency:
  group: web-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: '26.12.0'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
