name: Publish Fujimod
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (blank uses newest published release)
        required: false
        type: string
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    defaults:
      run:
        working-directory: apps/web
    # Review branches cannot redeploy the web app, even via workflow dispatch.
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'release' && github.event.release.target_commitish == 'main')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          lfs: true
      - name: Fetch model LFS objects
        run: git lfs pull
      - uses: actions/setup-node@v4
        with:
          node-version: '26.12.0'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Set up USB Wasm tools
        working-directory: .
        run: |
          rustup toolchain install 1.99.1 --profile minimal --target wasm32-unknown-unknown
          rustup default 1.99.1
          npm --prefix bindings/javascript ci
          npm --prefix bindings/javascript run setup:tooling
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Fetch verified release artifacts
        run: npm run prepare:release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
