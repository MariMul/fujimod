name: Simulator feedback
description: Share a simulator bug, idea, or improvement
labels: [Simulator]
body:
  - type: textarea
    id: feedback
    attributes:
      label: Feedback
    validations:
      required: false
  - type: input
    id: firmware
    attributes:
      label: Camera / firmware ID
  - type: input
    id: mod-build
    attributes:
      label: Mod build / build date
  - type: upload
    id: simulator-report
    attributes:
      label: Simulator report
      description: Drag and drop the downloaded simulator report ZIP here to upload it before submitting this issue.
    validations:
      required: false
      accept: ".zip"
