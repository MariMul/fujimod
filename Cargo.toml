[workspace]
members = [
  "crates/corpus",
  "crates/firmware",
  "crates/usb-proxy",
  "crates/defs",
  "crates/fujimod",
  "crates/usb",
  "bindings/python",
  "bindings/javascript",
  "bindings/generator",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/justjake/fujimod"
publish = false

[workspace.dependencies]
fujimod-defs = { path = "crates/defs", version = "0.1.0" }
serde = "1"
serde_json = "1"
fujimod-usb = { path = "crates/usb", version = "0.1.0" }
nusb = "0.2.8"
thiserror = "2"
futures-lite = "2"
futures-timer = { version = "3", features = ["wasm-bindgen"] }
pyo3 = { version = "=0.30.1", features = ["extension-module", "abi3-py310"] }

js-sys = "0.3"
wasm-bindgen-test = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
futures-channel = "0.3"

# Build executables stay unstripped; distribution profiles apply to libraries.
[profile.release.build-override]
strip = "none"
