[workspace]
members = [
  "crates/corpus",
  "crates/recording",
  "crates/remote",
  "crates/firmware",
  "crates/usb-proxy",
  "crates/simulation",
  "crates/catalog",
  "crates/emulator",
  "crates/emulator-cpu",
  "crates/emulator-cpu-hvf",
  "crates/emulator-cpu-unicorn",
  "crates/emulator-cpu-unicorn/sys",
  "crates/emulator-devices",
  "crates/settings",
  "crates/fujimod",
  "crates/usb",
  "crates/workflows",
  "bindings/python",
  "bindings/javascript",
  "bindings/javascript/emulator",
  "bindings/generator",
  "crates/workspace-hack",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
repository = "https://github.com/justjake/fujimod"
publish = false

[workspace.dependencies]
fujimod-remote = { path = "crates/remote", version = "0.1.0" }
fujimod-recording = { path = "crates/recording", version = "0.1.0" }
bevy = { version = "=0.20.0", default-features = false }
fujimod-simulation = { path = "crates/simulation", version = "0.1.0" }
fujimod-catalog = { path = "crates/catalog", version = "0.1.0" }
fujimod-emulator = { path = "crates/emulator", version = "0.1.0" }
fujimod-emulator-devices = { path = "crates/emulator-devices", version = "0.1.0" }
fujimod-emulator-cpu = { path = "crates/emulator-cpu", version = "0.1.0" }
fujimod-emulator-cpu-unicorn = { path = "crates/emulator-cpu-unicorn", version = "0.1.0" }
fujimod-firmware = { path = "crates/firmware", version = "0.1.0" }
fujimod-settings = { path = "crates/settings", version = "0.1.0" }
fujimod-emulator-cpu-hvf = { path = "crates/emulator-cpu-hvf", version = "0.1.0" }
fujimod-workspace-hack = { path = "crates/workspace-hack", version = "0.1.0" }
serde = "1"
serde_json = "1"
schemars = "1.2.3"
ciborium = "0.2"
fujimod-usb = { path = "crates/usb", version = "0.1.0" }
fujimod-workflows = { path = "crates/workflows", version = "0.1.0" }
nusb = "0.2.8"
rusqlite = { version = "0.40", features = ["bundled"] }
sha2 = "0.10"
thiserror = "2"
futures-lite = "2"
futures-timer = { version = "3", features = ["wasm-bindgen"] }
pyo3 = { version = "=0.30.1", features = ["extension-module", "abi3-py310"] }

js-sys = "0.3"
wasm-bindgen-test = "0.3"
wasm-bindgen = "0.2"
tsify = { version = "0.5.8", default-features = false, features = ["js"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen-futures = "0.4"
futures-channel = "0.3"

# Native emulator builds use release optimization for the runtime library.
# Sixteen codegen units with incremental compilation boot the X70 firmware as
# fast as one unit did and cut an emulator-device rebuild from about 1,040 to
# 260 CPU seconds; ThinLTO keeps cross-crate inlining (without it the boot took
# 7% more CPU). CI's rust-cache disables incremental compilation.
[profile.release]
lto = "thin"
codegen-units = 16
incremental = true

# Optimized native profiling without selecting Cargo's release profile.
# Tests retain the default development assertions and overflow checks.
[profile.performance]
inherits = "dev"
opt-level = 3
debug = 0
debug-assertions = false
overflow-checks = false
codegen-units = 16
lto = "off"
incremental = false

# Build executables stay unstripped; distribution profiles apply to libraries.
[profile.release.build-override]
strip = "none"

[profile.simulation-web]
inherits = "release"
incremental = false
opt-level = "s"
codegen-units = 1
lto = "thin"
strip = "debuginfo"
